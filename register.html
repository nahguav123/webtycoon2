<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Web Tycoon</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
  <div id="register-app" class="register-app">
    <form class="register-form" @submit.prevent="submitRegister">
      <h1 class="register-h1">Register</h1>
      <input v-model="register.username" placeholder="Username" class="register-field" type="text" required>
      <input v-model="register.email" placeholder="Email" class="register-field" type="email" required>
      <input v-model="register.password" placeholder="Password" class="register-field" type="password" required>
      <input v-model="register.confirmPassword" placeholder="Confirm Password" class="register-field" type="password" required>

      <button class="register-button" type="submit">Register</button>
      <div class="register-form-message" :style="{color: registerMessageColor}">{{ registerMessage }}</div>
      <div class="register-footer-note">
        Already have an account? <a href="login.html">Log in here</a>.
      </div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/util.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/api.js"></script>
  <script src="register.js"></script>
</body>
</html>
